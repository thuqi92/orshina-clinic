<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#a80d64">
<title>اورشينا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: sticky brand bar with section tabs; each department is its own page with its own books; client and employee files open in place. */
:root{
  --brand:#a80d64;--brand-deep:#7d0849;--brand-ink:#ffffff;
  --bg:#f8f4f7;--surface:#ffffff;--surface-2:#f3ebf0;--line:#eadce5;--fg:#24141d;--muted:#735f6b;
  --accent:#a80d64;--accent-ink:#ffffff;--accent-soft:#fbe4f0;
  --dental:#16707f;--dental-soft:#dff0f3;--inj:#6a3fbf;--inj-soft:#ece5fa;--laser:#9c5f08;--laser-soft:#f9ecd6;--skin:#2a6fb0;--skin-soft:#e1edf8;
  --good:#2b7a4b;--good-soft:#dff1e6;--bad:#b02a20;--bad-soft:#fae3e1;--warn:#946000;--warn-soft:#fbf0d9;
  --shadow:0 1px 2px rgba(40,20,50,.06),0 6px 20px rgba(40,20,50,.06);
  --f-head:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#8f0b55;--brand-deep:#5e0637;--brand-ink:#ffffff;
  --bg:#160e13;--surface:#21151c;--surface-2:#2c1d26;--line:#3d2a35;--fg:#f3e9ef;--muted:#b49faa;
  --accent:#f27ab9;--accent-ink:#2a0818;--accent-soft:#4a1f35;
  --dental:#5cc0cf;--dental-soft:#173a40;--inj:#b39af2;--inj-soft:#2f2550;--laser:#e8ae55;--laser-soft:#43321a;--skin:#7fb6ec;--skin-soft:#1c3048;
  --good:#6fcf95;--good-soft:#1c3a29;--bad:#f08a80;--bad-soft:#47201d;--warn:#e8b55a;--warn-soft:#41321a;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#8f0b55;--brand-deep:#5e0637;--brand-ink:#ffffff;
  --bg:#160e13;--surface:#21151c;--surface-2:#2c1d26;--line:#3d2a35;--fg:#f3e9ef;--muted:#b49faa;
  --accent:#f27ab9;--accent-ink:#2a0818;--accent-soft:#4a1f35;
  --dental:#5cc0cf;--dental-soft:#173a40;--inj:#b39af2;--inj-soft:#2f2550;--laser:#e8ae55;--laser-soft:#43321a;--skin:#7fb6ec;--skin-soft:#1c3048;
  --good:#6fcf95;--good-soft:#1c3a29;--bad:#f08a80;--bad-soft:#47201d;--warn:#e8b55a;--warn-soft:#41321a;
  --shadow:none;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.6rem;font-weight:600}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}.small{font-size:.85rem}
bdi{unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(100deg,var(--brand) 0%,var(--brand) 55%,var(--brand-deep) 100%);color:var(--brand-ink);box-shadow:0 2px 12px rgba(120,8,72,.18)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand img{height:34px;width:auto;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.brand small{display:block;color:rgba(255,255,255,.82);font-size:.75rem;border-inline-start:1px solid rgba(255,255,255,.35);padding-inline-start:12px;line-height:1.3}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-inline-start:auto;scrollbar-width:none;max-width:100%}
nav.tabs a{padding:7px 12px;border-radius:999px;text-decoration:none;color:rgba(255,255,255,.86);font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px}
nav.tabs a i{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
nav.tabs a:hover{background:rgba(255,255,255,.14);color:#fff}
nav.tabs a[aria-current="page"]{background:#fff;color:#a80d64;box-shadow:0 1px 4px rgba(0,0,0,.15)}
nav.tabs .sep{width:1px;background:rgba(255,255,255,.3);margin:6px 4px;flex:none}
nav.tabs a:focus-visible{outline-color:#fff}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:.85rem;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{color:var(--accent);text-decoration:none;font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.hello,.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);letter-spacing:.02em;margin-bottom:2px}
.hello .eyebrow i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{color:var(--muted);font-size:.82rem;letter-spacing:.02em}
.stat .v{font-family:var(--f-head);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{color:var(--muted);font-size:.8rem}
.stat.bad .v{color:var(--bad)}.stat.good .v{color:var(--good)}
.hello.home{background:linear-gradient(120deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.hello.home::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--accent);opacity:.07;pointer-events:none}
.gate{max-width:560px;margin:40px auto;text-align:center;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.gate .band{background:linear-gradient(120deg,var(--brand),var(--brand-deep));padding:28px 16px}
.gate .band img{height:44px;width:auto}
.gate .body{padding:20px}

.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.dental{background:var(--dental-soft);color:var(--dental)}
.chip.inj{background:var(--inj-soft);color:var(--inj)}
.chip.laser{background:var(--laser-soft);color:var(--laser)}
.chip.skin{background:var(--skin-soft);color:var(--skin)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.c-dental{background:var(--dental)}.c-inj{background:var(--inj)}.c-laser{background:var(--laser)}.c-skin{background:var(--skin)}.c-general{background:var(--muted)}

ul.appts,ul.rows,ul.visits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.appt{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.appt:first-child{border-top:0}
.appt .time{font-family:var(--f-head);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:center;padding:6px 0;border-radius:8px;background:var(--surface-2);font-size:.95rem}
.appt.s-cancelled,.appt.s-noshow{opacity:.55}
.appt.s-done .time{background:var(--good-soft);color:var(--good)}
.appt.s-arrived .time{background:var(--accent-soft);color:var(--accent)}
.name{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:start;font-size:1rem}
.name:hover{color:var(--accent)}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.86rem}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ctl select{padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem}
@media (max-width:560px){.appt{grid-template-columns:52px minmax(0,1fr)}.appt .ctl{grid-column:1/-1;justify-content:flex-start}}

.rows li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rows li:first-child{border-top:0}
.rows li > div{min-width:0}

.empty{padding:22px 12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.empty b{color:var(--fg);font-weight:600}

.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1 1 240px;min-width:0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:500;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);letter-spacing:.02em;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover{background:var(--surface-2)}
.tbl tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.tscroll{overflow-x:auto}
.td-detail{color:var(--muted);font-size:.88rem;min-width:180px}

.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500;align-self:flex-start}
.alerts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.dcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.dcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--bar)}
.dcard:hover{border-color:var(--bar)}
.dcard b{font-family:var(--f-head);font-size:1.05rem}
.dcard .row{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted);gap:8px}
.dcard .row span:last-child{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:500}

.devs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.devs button[aria-pressed]{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500}
.devs button[aria-pressed="true"]{background:var(--laser);border-color:var(--laser);color:var(--surface)}

/* tooth chart: viewed facing the patient, so FDI order is fixed LTR */
.chartwrap{overflow-x:auto;padding-bottom:4px}
.chart{min-width:560px;display:flex;flex-direction:column;gap:6px}
.jaw{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.jaw .tooth:nth-child(8){margin-right:6px}
.midline{height:1px;background:var(--line)}
.tooth{border:1px solid var(--line);background:var(--surface);border-radius:8px 8px 12px 12px;padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.jaw:last-child .tooth{border-radius:12px 12px 8px 8px}
.tooth .tn{font-size:.72rem;color:var(--muted);font-weight:600}
.tooth .tg{width:14px;height:14px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.tooth:hover{border-color:var(--accent)}
.t-caries .tg,.lg .t-caries{background:var(--bad);border-color:var(--bad)}
.t-filling .tg,.lg .t-filling{background:var(--dental);border-color:var(--dental)}
.t-rct .tg,.lg .t-rct{background:var(--accent);border-color:var(--accent)}
.t-crown .tg,.lg .t-crown{background:var(--warn);border-color:var(--warn)}
.t-implant .tg,.lg .t-implant{background:var(--good);border-color:var(--good)}
.t-missing{background:var(--surface-2);border-style:dashed}
.t-missing .tg,.lg .t-missing{background:transparent;border-style:dashed;border-color:var(--muted)}
.t-missing .tn{text-decoration:line-through}
.t-planned .tg,.lg .t-planned{background:transparent;border:2px solid var(--laser)}
.tooth.has-note .tn::after{content:"•";color:var(--accent);margin-inline-start:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--line);background:var(--surface-2)}

.visit{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.visit:first-child{border-top:0}
.visit .vd{font-size:.92rem}
.visit .vm{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.84rem}
.visit .price{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}

.period{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.period input{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.period label{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px}

/* modal */
#modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body:has(#modal:not([hidden])){overflow:hidden}
#modal .scrim{position:absolute;inset:0;background:rgba(20,10,25,.45)}
.sheet{position:relative;background:var(--surface);border-radius:16px;width:min(660px,100%);max-height:100%;min-height:0;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet .x{background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted)}
.mb{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex:1 1 auto;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet header,.sheet footer{flex:none}
@media (max-width:600px){
  #modal{align-items:flex-end;padding:env(safe-area-inset-top,0px) 0 0}
  .sheet{width:100%;max-height:92%;max-height:92dvh;border-radius:18px 18px 0 0;border-bottom:0}
  .sheet header{padding:14px 16px}
  .mb{padding:14px 16px}
  .sheet footer{padding:10px 16px max(12px,env(safe-area-inset-bottom,0px))}
  .sheet footer .btn{flex:1;padding:12px;font-size:1rem}
  input,select,textarea{font-size:16px}
}
.sheet footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-start;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:.82rem;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%;min-width:0}
.fld textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-weight:500}
.seg input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.seg.areas{gap:6px}
.seg.areas span{padding:6px 12px;font-size:.88rem;background:var(--surface)}
.sect{display:none;padding:12px;border-radius:12px;background:var(--surface-2)}
#mform[data-type="dental"] .f-dental,#mform[data-type="injection"] .f-injection,#mform[data-type="laser"] .f-laser,#mform[data-type="skin"] .f-skin{display:grid}
#mform:not([data-newp="1"]) .f-new{display:none}
.sect-t{grid-column:1/-1;font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}

.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
#toast{position:fixed;border:1px solid var(--line);bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
#toast.bad{background:var(--bad);color:#fff}
body.ro .w{display:none!important}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
.who{display:flex;gap:6px;align-items:center}
.whob{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.whob:hover{background:rgba(255,255,255,.24)}
.authf{display:flex;flex-direction:column;gap:12px;text-align:start;margin-top:12px}
.authf .btn{padding:11px;font-size:1rem}
.autherr{color:var(--bad);min-height:1.2em;margin:0;font-size:.9rem}
</style>
</head>
<body>
<div dir="rtl" lang="ar">
  <header class="top">

/* Data model (economical: few, aggregated documents)
   patients/{pid}            full file: info, teeth, visits{}, payments{}, appts{}   (opened only when viewed)

   ledger/hr_{YYYY-MM}_a     s{} staff payments
   fixedpaid/{YYYY}          items{key:{fid,amount,date,lk,eid}}
   employees/{id}, settings/main
   Deletions inside maps are soft: the entry gets del:true. */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const monthEnd=m=>{const [y,mo]=m.split('-').map(Number);return ymd(new Date(y,mo,0))};
const addMonths=(m,n)=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return ymd(d).slice(0,7)};
const LOC='ar-IQ-u-nu-latn';
const money=n=>Math.round(+n||0).toLocaleString('en-US')+' د.ع';

const fmtDate=s=>s?new Date(s+'T00:00').toLocaleDateString(LOC,{weekday:'short',day:'numeric',month:'short'}):'';

/* ---------- on-demand document subscriptions ---------- */
const SUBS=new Map();let NEED=new Set();
function D(path){NEED.add(path);const r=SUBS.get(path);return r&&r.ready?(r.exists?r.data:null):undefined}
function syncSubs(){
  if(!S.db)return;
  for(const p of NEED)if(!SUBS.has(p)){const rec={ready:false};SUBS.set(p,rec);
    rec.unsub=S.db.doc(p).onSnapshot(sn=>{rec.ready=true;rec.exists=sn.exists;rec.data=sn.exists?sn.data():null;scheduleRender()},err=>{rec.ready=true;rec.exists=false;rec.data=null;S.err=err?.code||'error';scheduleRender()})}
  for(const [p,rec] of SUBS)if(!NEED.has(p)){try{rec.unsub&&rec.unsub()}catch(e){}SUBS.delete(p)}
}
const pendingCount=()=>[...NEED].filter(p=>!SUBS.get(p)?.ready).length;
async function getDoc(path){const r=SUBS.get(path);if(r?.ready)return r.exists?r.data:null;const sn=await S.db.doc(path).get();return sn.exists?sn.data():null}
async function upsert(path,patch){const ref=S.db.doc(path);try{await ref.update(patch)}catch(e){if(e?.code!=='invalid_argument')throw e;const sn=await ref.get();if(sn.exists)await ref.update(patch);else await ref.set(patch)}}

const shardOf=date=>{const d=+date.slice(8,10);return d<=10?'a':d<=20?'b':'c'};
const lkey=(dept,date)=>`ledger/${dept}_${date.slice(0,7)}_${shardOf(date)}`;
function ledger(dept,m){const out={v:[],p:[],e:[],s:[],ready:true};
  (dept==='hr'?['a']:['a','b','c']).forEach(s=>{const d=D(`ledger/${dept}_${m}_${s}`);if(d===undefined)out.ready=false;if(d)['v','p','e','s'].forEach(k=>live(d[k]).forEach(x=>out[k].push(x)))});return out}
function dayAppts(date){const d=D('days/'+date);return live(d?.appts).map(a=>({...a,date}))}
function monthsIn(from,to,cap){const out=[];let m=from.slice(0,7);const end=to.slice(0,7);while(m<=end&&out.length<cap){out.push(m);m=addMonths(m,1)}return out}

/* ---------- patient index ---------- */
function rebuildIndex(){S.pidx=new Map();S.index.forEach(c=>Object.entries(c.items||{}).forEach(([pid,x])=>{if(x&&!x.del)S.pidx.set(pid,{...x,id:pid,chunk:c.id})}))}
function entryFor(p){
  const vs=live(p.visits),ps=live(p.payments);const dp={},nx={};
  DK.forEach(k=>{const kv=vs.filter(v=>v.type===k);dp[k]=sumBy(kv,'price')-sumBy(ps.filter(x=>x.dept===k),'amount');
    const last=kv.sort((a,b)=>cmp(b.date,a.date)||(b.createdAt||0)-(a.createdAt||0))[0];nx[k]=last?.d?.next||''});
  return{del:!!p.del,n:p.name||'',p:p.phone||'',l:vs.reduce((m,v)=>v.date>m?v.date:m,''),dep:DK.filter(k=>vs.some(v=>v.type===k)),al:p.allergies?1:0,dp,nx};
}
function pickChunk(){const counts={};S.index.forEach(c=>counts[c.id]=Object.keys(c.items||{}).length);
  const ok=Object.keys(counts).sort().find(k=>counts[k]<CHUNK_MAX);if(ok)return ok;let i=0;while(counts['c'+pad(i)]!==undefined)i++;return 'c'+pad(i)}
async function getPatient(pid){const p=await getDoc('patients/'+pid);if(!p)throw userErr('ما لكينا ملف الزبون.');return p}
async function writePatient(pid,patch,{reindex=true}={}){
  const p=await getPatient(pid);await S.db.doc('patients/'+pid).update(patch);
  const np=mergeDeep(structuredClone(p),patch);
  if(reindex)await upsert('index/'+p.chunk,{items:{[pid]:entryFor(np)}});
  return np;
}
async function createPatient(fields){const pid=rid();const chunk=pickChunk();
  const p={...fields,chunk,teeth:{},visits:{},payments:{},appts:{},createdAt:Date.now()};
  await S.db.doc('patients/'+pid).set(p);await upsert('index/'+chunk,{items:{[pid]:entryFor(p)}});return pid}
function debtors(dept){const out=[];for(const e of S.pidx.values()){const due=dept?(e.dp?.[dept]||0):DK.reduce((a,k)=>a+(e.dp?.[k]||0),0);if(due>0)out.push({e,due})}return out.sort((a,b)=>b.due-a.due)}
function matchEntry(e,q){if(!q)return true;q=q.trim().toLowerCase();return (e?.n||'').toLowerCase().includes(q)||(e?.p||'').replace(/\s/g,'').includes(q.replace(/\s/g,''))}
function followUps(dept){const td=today(),from=addDays(td,-14),to=addDays(td,14);const out=[];
  for(const e of S.pidx.values())(dept?[dept]:DK).forEach(k=>{const n=e.nx?.[k];if(n&&n>=from&&n<=to)out.push({pid:e.id,type:k,next:n})});
  return out.sort((a,b)=>cmp(a.next,b.next))}

function visitDetail(v){const d=v.d||{};let parts=[];
  if(v.type==='dental')parts=[d.procedure,d.teeth&&('الأسنان: '+d.teeth)];
  else if(v.type==='injection')parts=[d.product,d.brand,d.amount&&(d.amount+' '+(d.unit||'')),d.area,d.batch&&('باتش '+d.batch)];
  else if(v.type==='laser')parts=[d.device&&devName(d.device),d.area,d.shots&&(d.shots+' ضربة'),d.energy&&('طاقة '+d.energy),d.sessionNo&&('جلسة '+d.sessionNo+(d.sessionTotal?' من '+d.sessionTotal:'')),d.operator&&('الأوبريتر: '+(emp(d.operator)?.name||'—'))];
  else if(v.type==='skin')parts=[d.kind,d.skinType&&('بشرة '+d.skinType),d.operator&&('الأوبريتر: '+(emp(d.operator)?.name||'—'))];
  return parts.filter(Boolean).map(esc).join(' · ');
}

  const cnt={};Object.values(t).forEach(x=>{if(x?.s&&x.s!=='healthy')cnt[x.s]=(cnt[x.s]||0)+1});

}

function wireVisitForm(form){
  const sync=()=>{form.dataset.type=form.querySelector('[name=type]:checked')?.value||'dental'};
  form.querySelectorAll('[name=type]').forEach(r=>r.addEventListener('change',sync));sync();
  wirePicker(form);
  const pq=form.querySelector('[name=pq]');const sn=form.querySelector('[name=sessionNo]'),st=form.querySelector('[name=sessionTotal]'),dv=form.querySelector('[name=device]');
  let lastPid=null;
  if(form.dataset.edit)return;
  const sug=async()=>{const pid=PICK.byLabel.get(pq.value);if(!pid||pid===lastPid)return;lastPid=pid;
    try{const p=await getDoc('patients/'+pid);if(!p||lastPid!==pid)return;
      const prev=live(p.visits).filter(v=>v.type==='laser').sort((a,b)=>cmp(b.date,a.date)||(b.createdAt||0)-(a.createdAt||0))[0];
      sn.placeholder=prev?.d?.sessionNo?String(+prev.d.sessionNo+1):'';if(prev?.d?.sessionTotal&&!st.value)st.value=prev.d.sessionTotal;if(prev?.d?.device&&S.dev==='all')dv.value=prev.d.device;
      const lop=form.querySelector('[name=lop]');if(prev?.d?.operator&&!lop.value)lop.value=prev.d.operator;
    }catch(e){}};
  pq.addEventListener('change',sug);pq.addEventListener('input',sug);sug();
}
const vLabel=(type,name,price,date)=>`${DEPTS[type]?.v||'زيارة'} ${deptName(type)} · ${name} · ${money(price)} · ${date}`;
function parseTeeth(s){return uniq(String(s||'').split(/[^0-9]+/)).map(Number).filter(n=>VALID_T.has(n))}

async function saveVisit(o,appt,ed){
  const type=o.type;let d={};const keep=!!ed;
  if(type==='dental')d={procedure:o.procedure.trim(),teeth:parseTeeth(o.teeth).join(', ')};
  else if(type==='laser'){const sn=o.sessionNo.trim()||(!ed&&$('#mform [name=sessionNo]')?.placeholder)||'';d={device:o.device,operator:o.lop,shots:o.shots.trim(),energy:o.energy.trim(),area:[...Object.keys(o).filter(k=>/^lz_\d+$/.test(k)).sort((a,b)=>+a.slice(3)-+b.slice(3)).map(k=>o[k]),...splitAreas(o.larea)].join(' + '),sessionNo:sn,sessionTotal:o.sessionTotal.trim(),next:o.nextLaser||''}}
  else if(type==='injection')d={product:o.product.trim(),brand:o.brand.trim(),area:o.iarea.trim(),amount:o.amount.trim(),unit:o.unit,batch:o.batch.trim(),next:o.nextInj||''};
  else if(type==='skin')d={kind:o.kind.trim(),skinType:o.skinType,operator:o.sop,next:o.nextSkin||''};
  if(!keep)Object.keys(d).forEach(k=>{if(d[k]==='')delete d[k]});
  const price=num(o.price);const note=(o.note||'').trim();const by=byMe();
  if(ed){
    const pid=ed.pid;const p=await getPatient(pid);const old=p.visits?.[ed.vid];if(!old||old.del)throw userErr('ما لكينا الجلسة.');
    if(old.type!==type){['procedure','teeth','device','operator','shots','energy','area','sessionNo','sessionTotal','next','product','brand','amount','unit','batch','kind','skinType'].forEach(k=>{if(!(k in d))d[k]=''})}
    const ca=old.createdAt||Date.now();
    const patch={visits:{[ed.vid]:{type,date:o.date,d,price,note,createdAt:ca,editedBy:by}}};
    const st=PROC_TO_STATUS[d.procedure||''];
    if(type==='dental'&&o.applyTeeth&&st){const nums=parseTeeth(o.teeth);if(nums.length){patch.teeth={};nums.forEach(n=>patch.teeth[n]={s:st,note:p.teeth?.[n]?.note||''})}}
    const linked=live(p.payments).filter(x=>x.vid===ed.vid&&x.dept!==type);
    if(linked.length){patch.payments={};linked.forEach(x=>patch.payments[x.id]={dept:type})}
    await writePatient(pid,patch);
    const oldK=lkey(old.type,old.date),newK=lkey(type,o.date);
    if(oldK!==newK)await upsert(oldK,{v:{[ed.vid]:{del:true}}});
    await upsert(newK,{v:{[ed.vid]:{pid,n:p.name,date:o.date,d,price,note,createdAt:ca,by:old.by||by,del:false}}});
    for(const x of linked){await upsert(lkey(x.dept,x.date),{p:{[x.id]:{del:true}}});await upsert(lkey(type,x.date),{p:{[x.id]:{pid,n:p.name,amount:x.amount,date:x.date,note:x.note||'',vid:ed.vid,del:false}}})}
    await logAct('edit','visit',vLabel(type,p.name,price,o.date),{pid,id:ed.vid},old);
    toast('انحفظ التعديل');return;
  }
  const pid=await resolvePid(o);const p=await getPatient(pid);
  const paid=num(o.paid);const now=Date.now();
  const vid=rid(),payid=rid();
  const patch={visits:{[vid]:{type,date:o.date,d,price,note,createdAt:now,by}}};
  const lpatch={v:{[vid]:{pid,n:p.name,date:o.date,d,price,note,createdAt:now,by}}};
  if(paid>0){patch.payments={[payid]:{dept:type,amount:paid,date:o.date,note:'مع الجلسة',vid,createdAt:now,by}};lpatch.p={[payid]:{pid,n:p.name,amount:paid,date:o.date,note:'مع الجلسة',vid}}}
  const st=PROC_TO_STATUS[d.procedure||''];
  if(type==='dental'&&o.applyTeeth&&st){const nums=parseTeeth(o.teeth);if(nums.length){patch.teeth={};nums.forEach(n=>patch.teeth[n]={s:st,note:p.teeth?.[n]?.note||''})}}
  if(appt)patch.appts={[appt.id]:{st:'done'}};
  await writePatient(pid,patch);
  await upsert(lkey(type,o.date),lpatch);
  if(appt)await upsert('days/'+appt.date,{appts:{[appt.id]:{st:'done'}}});
  await logAct('add','visit',vLabel(type,p.name,price,o.date)+(paid>0?' · مدفوع '+money(paid):''),{pid,id:vid});
  toast('انحفظت');
}

/* ---- adapter: the small document API the app was written against ---- */
function mapErr(e){const c=(e&&e.code)||'';const m={'not-found':'invalid_argument','invalid-argument':'invalid_argument','permission-denied':'invalid_argument','resource-exhausted':'resource_exhausted','unavailable':'unavailable','unauthenticated':'revoked','deadline-exceeded':'unavailable'};
  const err=new Error(e?.message||String(e));err.code=m[c]||'unavailable';err.fb=c;if(c==='permission-denied')err.userMsg='ما عندك صلاحية لهذا الإجراء.';return err}
const isPlain=v=>v&&typeof v==='object'&&!Array.isArray(v)&&Object.getPrototypeOf(v)===Object.prototype;
function flat(obj,pre=[],out=[]){for(const k of Object.keys(obj)){const v=obj[k];const p=[...pre,k];if(isPlain(v)&&Object.keys(v).length)flat(v,p,out);else out.push([p,v])}return out}
function snapDoc(s){return{id:s.id,exists:s.exists,data:()=>s.exists?s.data():undefined,metadata:{fromCache:s.metadata.fromCache,hasPendingWrites:s.metadata.hasPendingWrites}}}
function docRef(r){return{id:r.id,path:r.path,
  get:async()=>{try{return snapDoc(await r.get())}catch(e){throw mapErr(e)}},
  set:async d=>{try{await r.set(d)}catch(e){throw mapErr(e)}},
  update:async d=>{const f=flat(d);if(!f.length)return;const args=[];f.forEach(([p,v])=>args.push(new firebase.firestore.FieldPath(...p),v));try{await r.update(...args)}catch(e){throw mapErr(e)}},
  delete:async()=>{try{await r.delete()}catch(e){throw mapErr(e)}},
  onSnapshot:(next,err)=>r.onSnapshot({includeMetadataChanges:false},s=>next(snapDoc(s)),e=>err&&err(mapErr(e))),
  collection:p=>colRef(r.collection(p))}}
function colRef(c){return{path:c.path,doc:id=>docRef(id?c.doc(id):c.doc()),
  add:async d=>{const r=c.doc();try{await r.set(d)}catch(e){throw mapErr(e)}return docRef(r)},
  get:async()=>{const qs=await c.get();return{docs:qs.docs.map(snapDoc),size:qs.size,empty:qs.empty}},
  onSnapshot:(next,err)=>c.onSnapshot(qs=>next({docs:qs.docs.map(snapDoc),size:qs.size,empty:qs.empty,metadata:{fromCache:qs.metadata.fromCache}}),e=>err&&err(mapErr(e)))}}
const DBA={doc:p=>docRef(fdb.doc(p)),collection:p=>colRef(fdb.collection(p))};

async function saveEmp(id,data){const pub={},priv={};Object.entries(data).forEach(([k,v])=>(PRIV.includes(k)?priv:pub)[k]=v);
  try{await fdb.doc('employees/'+id).set(pub,{merge:true});if(Object.keys(priv).length)await fdb.doc('empPrivate/'+id).set(priv,{merge:true})}catch(e){throw mapErr(e)}}
const normUser=s=>{const u=String(s||'').trim().toLowerCase();return /^[a-z0-9._-]{3,30}$/.test(u)?u:''};
async function createAccount(username,password,role,empId){
  const u=normUser(username);if(!u)throw userErr('اسم المستخدم لازم يكون بالإنكليزي: أحرف وأرقام بدون فراغات، 3 أحرف أو أكثر.');
  if(String(password||'').length<6)throw userErr('كلمة السر لازم 6 أحرف أو أكثر.');
  const sec=firebase.apps.find(a=>a.name==='accounts')||firebase.initializeApp(FB_CONFIG,'accounts');
  if(EMU&&!sec._emu){sec.auth().useEmulator('http://127.0.0.1:9099',{disableWarnings:true});sec._emu=1}
  let cred;try{cred=await sec.auth().createUserWithEmailAndPassword(u+EMAIL_DOMAIN,password)}
  catch(e){if((e.code||'').includes('email-already-in-use'))throw userErr('اسم المستخدم هذا مستخدم. اختار اسم ثاني.');throw userErr('ما انسوى الحساب. تأكد من الإنترنت وجرّب مرة ثانية.')}
  const uid=cred.user.uid;await sec.auth().signOut().catch(()=>{});
  try{await fdb.doc('users/'+uid).set({username:u,role,empId,createdAt:Date.now()})}catch(e){throw mapErr(e)}
  return{uid,username:u};
}

/* ---- one-time import of the old data (owner only, from a file on this computer) ---- */
const IMPF={running:false,done:0,total:0,err:''};
function importPanel(){
  if(S.userDoc?.role!=='owner')return '';const m=D('meta/import');if(m===undefined||m?.done)return '';
  const pct=IMPF.total?Math.floor(IMPF.done/IMPF.total*100):0;
  return `<section class="panel" id="importPanel" style="border-color:var(--accent)"><div class="ph"><h2>نقل البيانات من النسخة القديمة</h2></div>
   <p class="muted" style="margin:0 0 10px">اختار ملف البيانات اللي استلمته (orshina-data.json). خلي الصفحة مفتوحة لحد ما يخلص. بعد الزبائن يرفع حسابات الأقسام، وهاي ملفات أكبر فتتحرك أبطأ. إذا انقطع، اختار نفس الملف مرة ثانية ويكمّل من مكانه.</p>
   ${IMPF.running?'':'<input type="file" id="impFile" accept=".json,application/json" class="btn">'}
   <div style="height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:10px"><div id="impBar2" style="height:100%;width:${pct}%;background:var(--accent)"></div></div>
   <p class="small" id="impTxt2" style="margin:8px 0 0">${IMPF.running?`جاري النقل: ${IMPF.done.toLocaleString('en-US')} من ${IMPF.total.toLocaleString('en-US')}`:'جاهز'}</p>
   ${IMPF.err?`<div class="banner bad" style="margin-top:8px">${esc(IMPF.err)}</div>`:''}</section>`;
}
document.addEventListener('change',async e=>{
  if(e.target.id!=='impFile'||!e.target.files?.[0])return;const file=e.target.files[0];
  if(IMPF.running)return;IMPF.running=true;IMPF.err='';render();
  const warn=ev=>{ev.preventDefault();ev.returnValue=''};addEventListener('beforeunload',warn);
  const key='orshina_fileimport_'+file.size;
  try{
    const data=JSON.parse(await file.text());const items=data.docs||[];IMPF.total=items.length;
    let i=0;try{i=+(localStorage.getItem(key)||0)}catch(x){}IMPF.done=i;
    const enc=new TextEncoder();
    while(i<items.length){
      const b=fdb.batch();let ops=0,bytes=0;const start=i;
      // small batches (≤ ~600 KB, ≤ 250 docs) so slow connections keep moving
      while(i<items.length&&ops<250){const [path,doc,mode]=items[i];const sz=enc.encode(JSON.stringify(doc)).length;if(ops&&bytes+sz>600000)break;
        b.set(fdb.doc(path),doc,mode==='merge'?{merge:true}:{});ops++;bytes+=sz;i++}
      let tries=0;for(;;){try{await Promise.race([b.commit(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),120000))]);break}
        catch(x){if(x.code==='permission-denied'||x.code==='invalid-argument'||++tries>8){if(x.code==='timeout')x.message='الاتصال بطيء جداً';throw x}
          const t=document.getElementById('impTxt2');if(t)t.textContent=`الاتصال بطيء، نعيد المحاولة… (${start.toLocaleString('en-US')} من ${items.length.toLocaleString('en-US')})`;
          await new Promise(r=>setTimeout(r,1500*tries))}}
      IMPF.done=i;try{localStorage.setItem(key,String(i))}catch(x){}
      const bar=document.getElementById('impBar2'),t=document.getElementById('impTxt2');if(bar)bar.style.width=Math.floor(i/items.length*100)+'%';if(t)t.textContent=`جاري النقل: ${i.toLocaleString('en-US')} من ${items.length.toLocaleString('en-US')}`;
    }
    await fdb.doc('meta/import').set({done:true,at:Date.now(),total:items.length,source:data.source||''});
    try{localStorage.removeItem(key)}catch(x){}toast('خلص نقل البيانات');
  }catch(x){console.error(x);IMPF.err='توقف النقل: '+(x.code==='permission-denied'?'ما عندك صلاحية.':(x.message||'خلل غير معروف'))+'. اختار الملف مرة ثانية حتى يكمّل.'}
  IMPF.running=false;removeEventListener('beforeunload',warn);render();
});


/* ---- activity log: log/{YYYY-MM-DD}/by/{uid}  e{id:{at,who,act,kind,label,ref,before?}}
   Append-only by rule: nobody can change or remove an entry from the app. ---- */
async function logAct(act,kind,label,ref={},before=null){
  try{const now=new Date();const day=ymd(now);const who=S.myEmp?.name||(S.userDoc?.role==='owner'?'المدير':S.userDoc?.username)||'';
    let b=null;if(before){const s=JSON.stringify(before);b=s.length>8000?{_json:s.slice(0,8000)}:JSON.parse(s)}
    const entry={at:now.getTime(),who,act,kind,label:String(label||'').slice(0,300),ref:JSON.parse(JSON.stringify(ref||{}))};if(b)entry.before=b;
    await fdb.doc(`log/${day}/by/${S.uid}`).set({e:{[rid()]:entry}},{merge:true});LOG.stale=true}
  catch(e){console.warn('log failed',e)}
}
const LOG={key:'',loading:false,entries:[],err:'',stale:false,rows:[]};
const LOG_ACT={add:['إضافة','good'],edit:['تعديل','warn'],delete:['حذف','bad'],restore:['استرجاع','acc'],purge:['حذف نهائي','bad']};
const LOG_KIND={visit:'جلسة / زيارة',payment:'دفعة',expense:'مصروف',staffpay:'صرف لموظف',appt:'موعد',patient:'ملف زبون',employee:'موظف',settings:'إعدادات',teeth:'مخطط الأسنان'};
const RESTORABLE=new Set(['visit','payment','expense','staffpay','appt','patient','employee']);
function logDays(){let a=S.logFrom||addDays(today(),-6),b=S.logTo||today();if(a>b)[a,b]=[b,a];const out=[];let d=b;while(d>=a&&out.length<31){out.push(d);d=addDays(d,-1)}return out}
async function loadLog(force){
  const days=logDays();const key=days.join(',');if(!force&&LOG.key===key&&!LOG.stale)return;if(LOG.loading)return;
  LOG.key=key;LOG.loading=true;LOG.stale=false;scheduleRender();const out=[];
  try{await Promise.all(days.map(async d=>{const qs=await fdb.collection(`log/${d}/by`).get();qs.forEach(doc=>Object.entries(doc.data().e||{}).forEach(([id,x])=>out.push({id,uid:doc.id,day:d,...x})))}));
    LOG.entries=out.sort((a,b)=>b.at-a.at);LOG.err=''}
  catch(e){LOG.err=e.code==='permission-denied'?'ما عندك صلاحية تشوف السجل.':'ما كدرنا نحمّل السجل. تأكد من الإنترنت.'}
  LOG.loading=false;scheduleRender();
}
const fmtTime=t=>new Date(t).toLocaleString('ar-IQ-u-nu-latn',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function vLog(){
  if(!perm().admin)return noAccess();
  loadLog();
  const q=(S.logQ||'').trim().toLowerCase();const fa=S.logAct||'all',fw=S.logWho||'all',fk=S.logKind||'all';
  const whos=[...new Set(LOG.entries.map(e=>e.who).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
  const rows=LOG.entries.filter(e=>(fa==='all'||e.act===fa)&&(fw==='all'||e.who===fw)&&(fk==='all'||e.kind===fk)&&(!q||(e.label||'').toLowerCase().includes(q)||(e.who||'').toLowerCase().includes(q)));
  LOG.rows=rows;
  const rk=e=>e.kind+':'+(e.ref?.id||e.ref?.pid||'');const restored=new Map();LOG.entries.forEach(e=>{if(e.act==='restore'){const k=rk(e);if(!restored.has(k)||restored.get(k)<e.at)restored.set(k,e.at)}});
  const isRestored=e=>(restored.get(rk(e))||0)>e.at;
  const dels=LOG.entries.filter(e=>e.act==='delete');
  const sel=(id,cur,list)=>`<select id="${id}" class="btn sm">${list.map(([v,t])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
  return `<section class="hello"><div><h1>السجل</h1><p class="muted" style="margin:2px 0 0">كل إضافة وتعديل وحذف، منو سواه ومتى. محد يكدر يمسح من السجل.</p></div>
   <div class="actions"><button class="btn ${fa==='delete'?'primary':''}" data-act="log-trash">سلة المحذوفات (${dels.length})</button><button class="btn ghost" data-act="log-refresh">تحديث</button></div></section>
  <div class="period"><label>من <input type="date" id="logFrom" value="${S.logFrom||addDays(today(),-6)}"></label><label>إلى <input type="date" id="logTo" value="${S.logTo||today()}"></label>
   ${sel('logAct',fa,[['all','كل العمليات'],['delete','الحذف'],['edit','التعديل'],['add','الإضافة'],['restore','الاسترجاع']])}
   ${sel('logWho',fw,[['all','كل الموظفين'],...whos.map(w=>[w,w])])}
   ${sel('logKind',fk,[['all','كل الأنواع'],...Object.entries(LOG_KIND)])}
   <input id="logQ" type="search" class="btn sm" placeholder="ابحث باسم زبون أو مبلغ" value="${esc(S.logQ||'')}" style="min-width:180px"></div>
  <p class="muted small" style="margin:0">أقصى فترة 31 يوم. السجل يبدي من يوم تشغيل هذي الخاصية.</p>
  ${LOG.err?`<div class="banner bad">${esc(LOG.err)}</div>`:''}
  <section class="panel">${LOG.loading&&!LOG.entries.length?loadingBox():rows.length?`<div class="tscroll"><table class="tbl"><thead><tr><th>الوقت</th><th>منو</th><th>العملية</th><th>النوع</th><th>التفاصيل</th><th></th></tr></thead><tbody>
   ${rows.slice(0,500).map((e,i)=>{const a=LOG_ACT[e.act]||[e.act,''];return `<tr data-act="log-detail" data-i="${i}"><td class="num" style="white-space:nowrap">${fmtTime(e.at)}</td><td><b>${esc(e.who||'—')}</b></td><td>${chip(a[0],a[1])}</td><td>${esc(LOG_KIND[e.kind]||e.kind)}</td><td class="td-detail">${esc(e.label)}</td>
     <td>${e.act==='delete'&&RESTORABLE.has(e.kind)?(isRestored(e)?chip('انرجع','acc'):`<button class="btn sm w" data-act="log-restore" data-i="${i}">استرجاع</button>`):''}</td></tr>`}).join('')}
   </tbody></table></div>${rows.length>500?'<p class="muted small" style="text-align:center">يطلع أول 500. ضيّق الفترة أو استخدم الفلاتر.</p>':''}`:empty(fa==='delete'?'ماكو شي محذوف بهذي الفترة':'ماكو عمليات بهذي الفترة','جرّب فترة أطول أو غيّر الفلاتر.')}</section>`;
}
async function restoreEntry(en){const r=en.ref||{};
  switch(en.kind){
    case 'visit':{const p=await getDoc('patients/'+r.pid);const v=p?.visits?.[r.id];if(!v)throw userErr('ما لكينا الجلسة.');if(!v.del)throw userErr('هذي الجلسة مو محذوفة.');
      const patch={visits:{[r.id]:{del:false}}};(r.payIds||[]).forEach(id=>{(patch.payments=patch.payments||{})[id]={del:false}});
      await writePatient(r.pid,patch);await upsert(lkey(v.type,v.date),{v:{[r.id]:{del:false}}});
      for(const id of r.payIds||[]){const x=p.payments?.[id];if(x)await upsert(lkey(x.dept,x.date),{p:{[id]:{del:false}}})}break}
    case 'payment':{const p=await getDoc('patients/'+r.pid);const x=p?.payments?.[r.id];if(!x)throw userErr('ما لكينا الدفعة.');if(!x.del)throw userErr('هذي الدفعة مو محذوفة.');
      await writePatient(r.pid,{payments:{[r.id]:{del:false}}});if(!x.adj)await upsert(lkey(x.dept,x.date),{p:{[r.id]:{del:false}}});break}
    case 'expense':{const d=await getDoc(r.path);const e=d?.e?.[r.id];if(!e)throw userErr('ما لكينا المصروف.');if(!e.del)throw userErr('هذا المصروف مو محذوف.');
      await upsert(r.path,{e:{[r.id]:{del:false}}});if(e.fixedKey)await upsert('fixedpaid/'+e.fixedYear,{items:{[e.fixedKey]:{del:false}}});break}
    case 'staffpay':{const d=await getDoc(r.path);const x=d?.s?.[r.id];if(!x)throw userErr('ما لكينا العملية.');if(!x.del)throw userErr('هذي العملية مو محذوفة.');await upsert(r.path,{s:{[r.id]:{del:false}}});break}
    case 'appt':{await upsert('days/'+r.date,{appts:{[r.id]:{del:false}}});if(r.pid)await S.db.doc('patients/'+r.pid).update({appts:{[r.id]:{del:false}}}).catch(()=>{});break}
    case 'patient':{const p=await getDoc('patients/'+r.pid);if(!p)throw userErr('هذا الملف انحذف نهائياً وما يرجع.');if(!p.del)throw userErr('هذا الملف مو محذوف.');
      await writePatient(r.pid,{del:false});for(const a of r.appts||[])await upsert('days/'+a.date,{appts:{[a.id]:{del:false}}}).catch(()=>{});
      for(const a of r.appts||[])await S.db.doc('patients/'+r.pid).update({appts:{[a.id]:{del:false}}}).catch(()=>{});break}
    case 'employee':{const e=emp(r.id);if(!e)throw userErr('ما لكينا الموظف.');if(!e.deleted)throw userErr('هذا الموظف مو محذوف.');
      await saveEmp(r.id,{deleted:false,active:true});if(r.uid)await S.db.doc('users/'+r.uid).update({role:r.role||'none'}).catch(()=>{});break}
    default:throw userErr('هذا النوع ما يرجع تلقائياً.');
  }
  await logAct('restore',en.kind,en.label,r);LOG.stale=true;
}

    await logAct('purge','patient',p.name+(p.phone?' · '+p.phone:''),{pid},{name:p.name,phone:p.phone,visits:live(p.visits).length});
    try{await fdb.doc('index/'+p.chunk).update(new firebase.firestore.FieldPath('items',pid),firebase.firestore.FieldValue.delete());await fdb.doc('patients/'+pid).delete()}catch(e){throw mapErr(e)}
    S.pid=null;toast('انحذف نهائياً')})};
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='logFrom'||id==='logTo'){S[id]=e.target.value;render()}
  else if(id==='logAct'||id==='logWho'||id==='logKind'){S[id]=e.target.value;render()}});
let logQT;document.addEventListener('input',e=>{if(e.target.id==='logQ'){S.logQ=e.target.value;clearTimeout(logQT);logQT=setTimeout(()=>{render();const q=document.getElementById('logQ');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},250)}});

/* ---- session lifecycle ---- */
let PIN=[],pinnedOn=new Set(),userUnsub=null,pinRetry={};
function stopPinned(){PIN.forEach(u=>{try{u()}catch(e){}});PIN=[];pinnedOn=new Set();pinRetry={}}
function resetData(){for(const [,rec] of SUBS){try{rec.unsub&&rec.unsub()}catch(e){}}SUBS.clear();NEED=new Set();
  Object.assign(S,{index:[],employees:[],settings:[],pidx:new Map(),got:{},fresh:{},err:null,slow:false,pid:null,eid:null,userDoc:null,myEmp:null,isOwner:false,role:null});RAW.employees=[];RAW.empPrivate=[]}
function startPinned(){
  const admin=['owner','admin'].includes(S.userDoc?.role);const cols=[...PINNED,...(admin?['empPrivate']:[])];
  for(const col of cols){if(pinnedOn.has(col))continue;pinnedOn.add(col);
    PIN.push(fdb.collection(col).onSnapshot(qs=>{const docs=qs.docs.map(d=>({id:d.id,...d.data()}));
      if(col==='employees'||col==='empPrivate'){RAW[col]=docs;mergeEmps()}else S[col]=docs;
      S.got[col]=true;if(col==='index')rebuildIndex();if(!qs.metadata.fromCache)S.fresh[col]=true;scheduleRender()},
    e=>{if(e.code==='permission-denied'&&(pinRetry[col]=(pinRetry[col]||0)+1)<=5){pinnedOn.delete(col);setTimeout(()=>{if(S.authState==='in'&&S.userDoc&&S.userDoc.role!=='none')startPinned()},1200*pinRetry[col]);return}
      S.got[col]=true;if(e.code!=='permission-denied')S.err=e.code||'error';scheduleRender()}))}
}
S.authState='loading';
firebase.auth().onAuthStateChanged(async u=>{
  if(userUnsub){userUnsub();userUnsub=null}stopPinned();resetData();
  if(!u){S.db=null;S.uid=null;S.userReady=false;let setup=true;try{setup=(await fdb.doc('meta/setup').get()).exists}catch(e){}S.authState=setup?'out':'setup';render();return}
  S.db=DBA;S.uid=u.uid;S.authState='in';S.userReady=false;render();
  userUnsub=fdb.doc('users/'+u.uid).onSnapshot({includeMetadataChanges:true},s=>{
    if(s.metadata.hasPendingWrites)return;
    S.userDoc=s.exists?s.data():null;S.isOwner=S.userDoc?.role==='owner';S.userReady=true;
    if(S.userDoc&&S.userDoc.role!=='none')startPinned();else PINNED.forEach(c=>S.got[c]=true);
    render()},()=>{S.userDoc=null;S.userReady=true;PINNED.forEach(c=>S.got[c]=true);render()});
});
route();render();

</script>
